services:
  # Backend API
  - type: web
    name: hivemind-api
    env: python
    region: oregon
    plan: standard
    dockerfilePath: ./apps/api/Dockerfile
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: BYBIT_API_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hivemind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hivemind-redis
          property: connectionString

  # Frontend Web
  - type: web
    name: hivemind-web
    env: node
    region: oregon
    plan: standard
    dockerfilePath: ./apps/web/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_WS_URL
        sync: false

  # Redis
  - type: redis
    name: hivemind-redis
    plan: standard
    maxmemoryPolicy: allkeys-lru

databases:
  - name: hivemind-db
    plan: standard
    databaseName: hivemind_db
    user: hivemind_user
