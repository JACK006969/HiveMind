services:
  - type: web
    name: hivemind-api
    env: python
    buildCommand: "cd apps/api && pip install -r requirements.txt"
    startCommand: "cd apps/api && gunicorn main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: BYBIT_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: hivemind-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: hivemind-redis
          property: connectionString

  - type: web
    name: hivemind-web
    env: node
    buildCommand: "cd apps/web && npm install && npm run build"
    startCommand: "cd apps/web && npm start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXT_PUBLIC_WS_URL
        sync: false

  - type: redis
    name: hivemind-redis

databases:
  - name: hivemind-db
